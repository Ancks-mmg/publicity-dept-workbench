  /* ---- 云盘渲染 ---- */
  function renderDrive() {
    var host = $('tab-drive');
    if (!host) return;
    clear(host);

    var head = el('div', { cls: 'section-head' }, [el('h2', { text: '资料库云盘' }), el('div', { cls: 'spacer' })]);
    head.appendChild(el('button', {

      on: { click: openFolderSync }
    }));
    head.appendChild(el('button', {
      cls: 'btn btn-ghost btn-sm', text: '＋ 新建文件夹', attrs: { type: 'button' },
      on: { click: function () { openFolderModal({ parentId: state.cwd, record: null }); } }
    }));
    head.appendChild(el('button', {
      cls: 'btn btn-sm', text: '⬆ 上传文件', attrs: { type: 'button' }, on: { click: pickFiles }
    }));
    host.appendChild(head);

    // 面包屑
    var crumbs = el('div', { cls: 'crumbs' });
    function crumb(text, id) {
      var b = el('button', {
        cls: 'crumb' + (String(id) === String(state.cwd) ? ' on' : ''), text: text, attrs: { type: 'button' }
      });
      b.addEventListener('click', function () { state.cwd = id; renderDrive(); });
      return b;
    }
    crumbs.appendChild(crumb('☁ 云盘', null));
    var trail = pathOf(state.cwd);
    trail.forEach(function (f) {
      crumbs.appendChild(el('span', { cls: 'crumb-sep', text: '/' }));
      crumbs.appendChild(crumb(f.name, f.id));
    });
    host.appendChild(crumbs);

    // 当前层信息
    var baseFiles = filesOf(state.cwd);
    var baseSubs = childrenOf(state.cwd);
    var info = el('div', { cls: 'notice notice-info' }, [
      el('span', {
        text: '当前位置：' + curFolderName() +
          ' · 本层分类：' + ((state.cwd == null ? '云盘根目录' : (folderById(state.cwd) || {}).category) || '未分类') +
          ' · 子文件夹 ' + baseSubs.length + ' 个 · 文件 ' + baseFiles.length + ' 个'
      }),
      el('div', { cls: 'spacer' })
    ]);
    if (state.cwd != null) {
      var cur = folderById(state.cwd);
      info.appendChild(el('button', {
        cls: 'link-btn', text: '改分类', attrs: { type: 'button' },
        on: { click: function () { openFolderModal({ parentId: cur.parent_id, record: cur }); } }
      }));
    }
    host.appendChild(info);

    // 搜索
    var q = el('input', { cls: 'input', attrs: { type: 'text', placeholder: '在当前层搜索…' } });
    q.value = state.driveQuery || '';
    q.addEventListener('input', function () { state.driveQuery = q.value; paint(); });
    host.appendChild(el('div', { cls: 'toolbar' }, [q]));

    var listWrap = el('div', { cls: 'drive-list' });
    host.appendChild(listWrap);

    function paint() {
      clear(listWrap);
      var kw = (state.driveQuery || '').trim().toLowerCase();
      var subs = baseSubs.filter(function (f) { return !kw || String(f.name).toLowerCase().indexOf(kw) >= 0; });
      var fls = baseFiles.filter(function (f) { return !kw || String(f.name).toLowerCase().indexOf(kw) >= 0; });

      if (!subs.length && !fls.length) {
        listWrap.appendChild(el('div', { cls: 'empty', text: baseSubs.length || baseFiles.length ? '没有匹配的内容' : '这一层还是空的，点右上角「新建文件夹」或「上传文件」开始吧' }));
        return;
      }

      subs.forEach(function (f) {
        var fs = subtreeFiles(f.id);
        var size = fs.reduce(function (s, x) { return s + (Number(x.size) || 0); }, 0);
        var pending = fs.filter(function (x) { return !x.storage_path; }).length;
        var meta = (descendantIds(f.id).length - 1) + ' 个子文件夹 · ' + fs.length + ' 个文件 · ' + fmtSize2(size)
          + (pending ? ' · ' + pending + ' 待上传' : '');
        var row = el('div', { cls: 'drow' });
        row.appendChild(el('div', { cls: 'dicon folder', text: '📁' }));
        var main = el('div', { cls: 'dmain' });
        var nameLine = el('div', { cls: 'dname' });
        var nm = el('button', { cls: 'dname-btn', text: f.name, attrs: { type: 'button' } });
        nm.addEventListener('click', function () { state.cwd = f.id; state.driveQuery = ''; renderDrive(); });
        nameLine.appendChild(nm);
        nameLine.appendChild(el('span', { cls: 'tag tag-primary', text: f.category || '未分类' }));
        if (pending) nameLine.appendChild(el('span', { cls: 'tag tag-warn', text: pending + ' 待上传' }));
        main.appendChild(nameLine);
        main.appendChild(el('div', { cls: 'dmeta', text: meta }));
        row.appendChild(main);
        var act = el('div', { cls: 'dact' });
        act.appendChild(el('button', {
          cls: 'link-btn', text: '打开', attrs: { type: 'button' },
          on: { click: function () { state.cwd = f.id; state.driveQuery = ''; renderDrive(); } }
        }));
        act.appendChild(el('button', {
          cls: 'link-btn', text: '重命名/分类', attrs: { type: 'button' },
          on: { click: function () { openFolderModal({ parentId: f.parent_id, record: f }); } }
        }));
        act.appendChild(el('button', {
          cls: 'link-btn link-danger', text: '删除', attrs: { type: 'button' },
          on: { click: function () { confirmDeleteFolder(f); } }
        }));
        row.appendChild(act);
        listWrap.appendChild(row);
      });

      fls.forEach(function (f) {
        var kind = fileKind(f.name);
        var row = el('div', { cls: 'drow' });
        row.appendChild(el('div', { cls: 'dicon', text: kind.icon }));
        var main = el('div', { cls: 'dmain' });
        var nameLine = el('div', { cls: 'dname' });
        var nm = el('button', { cls: 'dname-btn', text: f.name, attrs: { type: 'button' } });
        nm.addEventListener('click', function () { openFileRec(f); });
        nameLine.appendChild(nm);
        if (!f.storage_path) nameLine.appendChild(el('span', { cls: 'tag tag-warn', text: '待上传' }));
        main.appendChild(nameLine);
        main.appendChild(el('div', {
          cls: 'dmeta',
          text: kind.label + ' · ' + fmtSize2(f.size) + ' · ' + (f.uploader_name || '未记录上传者') + ' · ' + (f.storage_path ? fmtTime(f.created_at) : '仅登记')
        }));
        row.appendChild(main);
        var act = el('div', { cls: 'dact' });
        if (f.storage_path) {
          act.appendChild(el('button', { cls: 'link-btn', text: '打开', attrs: { type: 'button' }, on: { click: function () { openFileRec(f); } } }));
          act.appendChild(el('button', { cls: 'link-btn', text: '下载', attrs: { type: 'button' }, on: { click: function () { downloadFileRec(f); } } }));
        } else {
          act.appendChild(el('button', {
            cls: 'link-btn', text: '补传', attrs: { type: 'button' },
            on: { click: function () { pickOneFor(f); } }
          }));
        }
        act.appendChild(el('button', { cls: 'link-btn', text: '重命名', attrs: { type: 'button' }, on: { click: function () { openRenameFile(f); } } }));
        act.appendChild(el('button', { cls: 'link-btn link-danger', text: '删除', attrs: { type: 'button' }, on: { click: function () { confirmDeleteFile(f); } } }));
        row.appendChild(act);
        listWrap.appendChild(row);
      });
    }
    paint();
  }

  function pickOneFor(rec) {

  /* ---------------- 任务统计（共同参与） ---------------- */
  function splitNames(s) {
    if (!s) return [];
    return String(s).split(/[、,，;；\s/]+/).map(function (x) { return x.trim(); }).filter(Boolean);
  }
  function mergeNames(arr) {
    var seen = {}, out = [];
    (arr || []).forEach(function (s) { splitNames(s).forEach(function (n) { if (!seen[n]) { seen[n] = 1; out.push(n); } }); });
    return out;
  }
  function taskParticipants(rec) {
    return mergeNames([rec.participants, rec.responsible, rec.collaborators]);
  }
  function statsFieldRow(label, val) {
    if (val == null || val === '') return null;
    return el('div', { cls: 'stat-field' }, [
      el('div', { cls: 'stat-k', text: label }),
      el('div', { cls: 'stat-v', text: String(val) })
    ]);
  }
  function openStatTask(t) {
    var rec = t.rec, rows = [];
    if (t.table === 'progress') {
      rows.push(statsFieldRow('项目名称', rec.project));
      rows.push(statsFieldRow('工作事项', rec.task));
      rows.push(statsFieldRow('当前状态', rec.status));
      rows.push(statsFieldRow('参与人员', mergeNames([rec.participants, rec.responsible, rec.collaborators]).join('、')));
      rows.push(statsFieldRow('开始时间', rec.start_date));
      rows.push(statsFieldRow('截止时间', rec.due_date));
      rows.push(statsFieldRow('下一步', rec.next_step));
      rows.push(statsFieldRow('最新进展', rec.latest));
      rows.push(statsFieldRow('备注', rec.note));
    } else {
      rows.push(statsFieldRow('项目', rec.project));
      rows.push(statsFieldRow('时间', rec.archive_date));
      rows.push(statsFieldRow('参与人员', mergeNames([rec.participants, rec.responsible, rec.collaborators]).join('、')));
      rows.push(statsFieldRow('完成情况', rec.result));
      rows.push(statsFieldRow('反思总结', rec.reflection));
    }
    var body = el('div', { cls: 'modal-body' }, rows.filter(Boolean));
    if (!body.children.length) body.appendChild(el('div', { cls: 'empty', text: '暂无更多信息' }));
    mountModal(modalShell('任务详情 · ' + (t.label || ('#' + rec.id)), body, el('div', { cls: 'modal-foot' }, [
      el('button', { cls: 'btn btn-ghost', text: '关闭', attrs: { type: 'button' }, on: { click: closeModal } })
    ])));
  }

      });
    });
    var statusCount = { '🤍 未开始': 0, '💛 进行中': 0, '💚 已完成': 0, '已归档': 0 };
    tasks.forEach(function (t) { statusCount[t.status] = (statusCount[t.status] || 0) + 1; });
    var members = MEMBER_LIST.slice();
    var extra = {};
    tasks.forEach(function (t) { t.participants.forEach(function (n) { if (MEMBER_LIST.indexOf(n) < 0) extra[n] = 1; }); });
    Object.keys(extra).sort().forEach(function (n) { members.push(n); });
    var rows = members.map(function (m) {

      var notStart = mine.filter(function (t) { return t.status === '🤍 未开始'; }).length;
      var doing = mine.filter(function (t) { return t.status === '💛 进行中'; }).length;
      var done = mine.filter(function (t) { return t.status === '💚 已完成'; }).length;
      var archived = mine.filter(function (t) { return t.status === '已归档'; }).length;
      var dates = mine.map(function (t) { return t.date; }).filter(Boolean).sort();
      return { name: m, total: mine.length, notStart: notStart, doing: doing, done: done, archived: archived, last: dates.length ? dates[dates.length - 1] : '', mine: mine, isExtra: MEMBER_LIST.indexOf(m) < 0 };
    });
    return { tasks: tasks, statusCount: statusCount, members: members, rows: rows };
  }

  function annSeenGet() {

  /* ---------------- 启动 ---------------- */
  async function boot() {
    if (typeof WorkBuddyCloud === 'undefined' || !WorkBuddyCloud.createWorkBuddyCloud) {
      $('boot').textContent = '云服务组件加载失败，请检查网络后刷新页面。';
      return;
    }
    cloud = WorkBuddyCloud.createWorkBuddyCloud({
      endpoint: publicConfig.endpoint,
      oauthRelayBaseUrl: publicConfig.oauthRelayBaseUrl,
      publishableKey: publicConfig.publishableKey
    });

    setEntryMode('register');

    try {
      var cb = await cloud.auth.handleWechatWebCallback();
      if (cb && cb.error) {
        showLogin();
        showLoginMsg(cb.error.message || '微信登录失败，请重试');
        return;
      }
      if (cb && cb.data) {
        history.replaceState(null, '', location.pathname);
        state.user = cb.data.user;
        state.profile = await fetchMyProfile();
        afterAuth();
        return;
      }
    } catch (e) { /* 无 code 时按普通访问继续 */ }

    try {
      var s = await cloud.auth.getSession();
      if (s && s.data && !s.error) {
        state.user = s.data.user;
        state.profile = await fetchMyProfile();
        afterAuth();
        return;
      }
    } catch (e) { /* 继续到登录页 */ }
    showLogin();
  }

  /* ---------------- 事件绑定 ---------------- */
  $('entry-seg').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (b && b.dataset.mode) setEntryMode(b.dataset.mode);
  });
  $('send-code-btn').addEventListener('click', sendCode);
  $('phone-submit-btn').addEventListener('click', submitPhone);
  $('wechat-login-btn').addEventListener('click', wechatLogin);
  $('setup-save-btn').addEventListener('click', saveSetup);
  $('setup-logout').addEventListener('click', logout);
  $('logout-btn').addEventListener('click', logout);
  $('me-btn').addEventListener('click', openMyModal);
  $('phone-input').addEventListener('input', function () { setPhoneError(''); });
  $('code-input').addEventListener('keydown', function (e) { if (e.key === 'Enter') submitPhone(); });
  $('phone-input').addEventListener('keydown', function (e) { if (e.key === 'Enter') sendCode(); });
  $('name-input').addEventListener('keydown', function (e) { if (e.key === 'Enter') submitPhone(); });
  $('invite-input').addEventListener('keydown', function (e) { if (e.key === 'Enter') submitPhone(); });
  $('setup-name').addEventListener('keydown', function (e) { if (e.key === 'Enter') saveSetup(); });
  $('tabs').addEventListener('click', function (e) {
    var btn = e.target.closest('.tab');
    if (btn) switchTab(btn.dataset.tab);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (!$('pv-view').hidden) { closePreview(); return; }
    closeModal();
  });

  /* 预览层：关闭 / 下载 / 交给系统应用；返回键也能退出预览（走 pushState 历史） */
  $('pv-close').addEventListener('click', function () { closePreview(); });
  $('pv-dl').addEventListener('click', function () { if (pvState.rec) downloadFileRec(pvState.rec); });
  $('pv-ext').addEventListener('click', openExternal);
  window.addEventListener('popstate', function () {
    if (!$('pv-view').hidden) closePreview(true);
  });

  boot();
})();
</script>
</body>
</html>
