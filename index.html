<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>宣传部资料整理工作台</title>
<link rel="icon" type="image/jpeg" href="logo.jpg">
<style>
:root{
  --bg:#f4f5f7; --surface:#fff; --surface-2:#fafbfc; --border:#e4e7ec; --border-2:#d0d5dd;
  --text:#1a1f2b; --muted:#667085; --faint:#98a2b3;
  --primary:#4f46e5; --primary-dark:#4338ca; --primary-soft:#eef2ff;
  --ok:#067647; --ok-soft:#ecfdf3; --warn:#b54708; --warn-soft:#fffaeb;
  --danger:#b42318; --danger-soft:#fef3f2; --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--text); font-size:14px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:14px;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
[hidden]{display:none !important}

.center-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}

/* ---------- 登录 / 注册 ---------- */
.login-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);
  border-radius:16px;padding:34px 30px;box-shadow:0 1px 3px rgba(16,24,40,.06),0 12px 32px rgba(16,24,40,.06)}
.login-brand{text-align:center;margin-bottom:22px}
.login-logo{width:56px;height:56px;border-radius:15px;background:#fff;border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;margin:0 auto 14px;overflow:hidden}
.login-logo img{width:100%;height:100%;object-fit:cover;display:block}
.login-brand h1{margin:0 0 6px;font-size:19px;font-weight:600}
.login-brand p{margin:0;color:var(--muted);font-size:13px}
.seg{display:flex;background:#f1f2f6;border-radius:9px;padding:3px;margin-bottom:20px}
.seg button{flex:1;height:36px;border:none;background:none;border-radius:7px;color:var(--muted);font-weight:500;transition:.15s}
.seg button.on{background:var(--surface);color:var(--primary-dark);box-shadow:0 1px 2px rgba(16,24,40,.08)}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.field .opt{color:var(--faint);font-size:12px}
.input{width:100%;height:42px;padding:0 12px;border:1px solid var(--border-2);border-radius:8px;
  background:var(--surface);outline:none;transition:border-color .15s,box-shadow .15s}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.input::placeholder{color:var(--faint)}
.row-inline{display:flex;gap:8px}
.row-inline .input{flex:1}
.btn{height:42px;padding:0 16px;border-radius:8px;border:1px solid transparent;
  background:var(--primary);color:#fff;font-weight:500;transition:background .15s,opacity .15s;white-space:nowrap}
.btn:hover{background:var(--primary-dark)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{background:var(--surface);color:var(--text);border-color:var(--border-2)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-sm{height:34px;padding:0 12px;font-size:13px;border-radius:7px}
.btn-block{width:100%}
.btn-danger{background:var(--danger)}
.btn-danger:hover{background:#912018}
.btn-wechat{background:#07c160;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-wechat:hover{background:#06ad56}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--faint);font-size:12px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border)}
.msg{font-size:13px;border-radius:8px;padding:9px 12px;margin-bottom:12px;display:none}
.msg.show{display:block}
.msg-error{background:var(--danger-soft);color:var(--danger)}
.msg-info{background:var(--primary-soft);color:var(--primary-dark)}
.msg-ok{background:var(--ok-soft);color:var(--ok)}
.field-error{font-size:12px;color:var(--danger);margin-top:5px;display:none}
.field-error.show{display:block}
.hint{font-size:12px;color:var(--faint);margin-top:5px;line-height:1.6}
.login-foot{margin-top:18px;text-align:center;font-size:12px;color:var(--faint);line-height:1.7}

/* ---------- 主界面 ---------- */
.app-header{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.app-header-inner{max-width:1240px;margin:0 auto;padding:0 20px;height:58px;display:flex;align-items:center;gap:12px}
.app-title{font-size:15px;font-weight:600;display:flex;align-items:center;gap:9px;white-space:nowrap}
.app-mark{width:28px;height:28px;border-radius:8px;background:#fff;border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.app-mark img{width:100%;height:100%;object-fit:cover;display:block}
.app-header .spacer{flex:1}
.user-chip{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);white-space:nowrap}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--primary-soft);color:var(--primary-dark);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:none}
.role-badge{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;
  background:var(--primary-soft);color:var(--primary-dark);margin-left:2px}

.board-bar{background:#fbfbfd;border-bottom:1px solid var(--border)}
.boards{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;gap:8px}
.board{height:38px;padding:0 18px;border-radius:9px;border:1px solid var(--border-2);
  background:var(--surface);color:var(--muted);font-weight:500;transition:.15s}
.board:hover{color:var(--text)}
.board.on{background:var(--primary);border-color:var(--primary);color:#fff}
.board .cnt{font-weight:400;opacity:.75;font-size:12px;margin-left:4px}

.tabs-bar{background:var(--surface);border-bottom:1px solid var(--border)}
.tabs{max-width:1240px;margin:0 auto;padding:0 20px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;background:none;border:none;padding:12px 14px;font-size:14px;color:var(--muted);
  border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s,border-color .15s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:500}

.main{max-width:1240px;margin:0 auto;padding:22px 20px 60px}
.section-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.section-head h2{margin:0;font-size:16px;font-weight:600}
.section-head .spacer{flex:1}

.notice{display:flex;align-items:flex-start;gap:10px;background:var(--warn-soft);color:var(--warn);
  border:1px solid #fedf89;border-radius:var(--radius);padding:12px 14px;font-size:13px;margin-bottom:16px}
.notice-info{background:var(--primary-soft);color:var(--primary-dark);border-color:#c7d2fe}
.notice .spacer{flex:1}

/* ---------- 公告 ---------- */
.ann-bar{max-width:1240px;margin:0 auto;padding:14px 20px 0}
.ann-bar .notice{margin-bottom:0;align-items:center}
.ann-ico{font-size:15px;line-height:1.5}
.ann-text{flex:1;min-width:0;line-height:1.55}
.ann-x{background:none;border:none;color:inherit;opacity:.55;font-size:17px;line-height:1;padding:2px 6px}
.ann-x:hover{opacity:1}
.ann-t-info{background:var(--primary-soft);color:var(--primary-dark);border-color:#c7d2fe}
.ann-t-ok{background:var(--ok-soft);color:var(--ok);border-color:#a9e2c3}
.ann-t-warn{background:var(--warn-soft);color:var(--warn);border-color:#fedf89}
.ann-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px}
.ann-item-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px}
.ann-item-head strong{font-size:14px;font-weight:600}
.ann-chip{font-size:12px;padding:1px 9px;border-radius:99px;border:1px solid transparent;white-space:nowrap}
.ann-time{font-size:12px;color:var(--faint)}
.ann-content{white-space:pre-wrap;font-size:13px;line-height:1.8;word-break:break-word}
.ann-item-acts{display:flex;gap:6px;margin-top:11px;padding-top:11px;border-top:1px dashed var(--border)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px 16px}
.stat .k{font-size:12px;color:var(--muted);margin-bottom:6px}
.stat .v{font-size:23px;font-weight:600;letter-spacing:-.5px}
.stat .u{font-size:13px;font-weight:400;color:var(--muted);margin-left:2px}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px}
.panel h3{margin:0 0 14px;font-size:14px;font-weight:600}
.bar-row{display:grid;grid-template-columns:96px 1fr 52px;align-items:center;gap:10px;margin-bottom:9px;font-size:13px}
.bar-track{height:9px;background:#eef1f4;border-radius:99px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;background:var(--primary)}
.bar-num{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}

.toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.toolbar .input{height:36px;max-width:230px}
.toolbar select.input{max-width:150px}
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 13px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
th{background:var(--surface-2);color:var(--muted);font-weight:500;font-size:12px}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
td.wrap{white-space:normal;max-width:280px}

/* ---------- 工作表（工作总览 / 历史归档）---------- */
.sheet-wrap{background:#fff;border:1px solid #dde5d4;border-radius:10px;overflow:hidden}
.sheet-scroll{overflow:auto;max-height:calc(100vh - 250px)}
table.sheet{border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:13px;background:#fff}
table.sheet th,table.sheet td{padding:0;border-right:1px solid #e5ecdb;border-bottom:1px solid #e5ecdb}
table.sheet thead th{position:sticky;top:0;z-index:3;height:36px;font-size:12.5px;font-weight:600}
table.sheet thead th:last-child{border-right:none}
table.sheet .th-in{display:flex;align-items:center;gap:5px;height:36px;padding:0 9px}
table.sheet .th-txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.sheet .th-btn{flex:none;width:17px;height:17px;border-radius:4px;border:none;background:rgba(255,255,255,.5);
  color:inherit;font-size:8px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
table.sheet .th-btn:hover{background:rgba(255,255,255,.96)}
table.sheet .th-btn.on{background:#fff;box-shadow:0 0 0 1.5px currentColor inset}
table.sheet tbody td{height:38px;padding:7px 9px;color:#1f252d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.sheet tbody tr:nth-child(even) td{background:#eaf6e1}
table.sheet tbody tr:hover td{background:#d8edca}
table.sheet td.wrap{white-space:normal;overflow:visible;text-overflow:clip;word-break:break-word}
table.sheet tbody td.expanded{white-space:normal;overflow:visible;text-overflow:clip;word-break:break-word;height:auto}
table.sheet td.act{white-space:nowrap;padding:0 6px}
table.sheet tbody tr.empty-row td{background:#fff;color:var(--faint);text-align:center;padding:30px 0;font-size:13px}

/* ---------- 任务统计 ---------- */
table.stattable{width:100%;border-collapse:collapse;font-size:13px}
table.stattable th,table.stattable td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
table.stattable th{background:var(--surface-2);color:var(--muted);font-weight:500;font-size:12px}
table.stattable tbody tr:last-child td{border-bottom:none}
table.stattable tbody tr:hover{background:var(--surface-2)}
table.stattable td.num{text-align:right;font-variant-numeric:tabular-nums}
table.stattable td.name{font-weight:500;cursor:pointer;color:var(--primary-dark)}
table.stattable tr.zero td{color:var(--faint)}
.matrix-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:8px;background:#fff}
table.matrix{border-collapse:separate;border-spacing:0;font-size:12px;min-width:100%}
table.matrix th,table.matrix td{border-right:1px solid #eef1f4;border-bottom:1px solid #eef1f4;padding:0;text-align:center;vertical-align:middle;height:34px}
table.matrix tr:last-child td{border-bottom:none}
table.matrix th:last-child,table.matrix td:last-child{border-right:none}
table.matrix th{background:#f6f8fa}
table.matrix td.matrix-name,table.matrix th.matrix-name{position:sticky;left:0;background:#fff;text-align:left;padding:0 12px;width:88px;min-width:88px;font-weight:500;white-space:nowrap;cursor:pointer;border-right:1px solid var(--border);z-index:1}
table.matrix th.matrix-name{background:#f6f8fa;z-index:2}
table.matrix .matrix-head{padding:6px 8px 2px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;cursor:pointer}
table.matrix .matrix-sub{font-size:11px;color:var(--muted);padding:0 8px 7px;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}
table.matrix td.matrix-cell{width:48px;min-width:48px;cursor:default}
table.matrix td.matrix-cell.on{background:var(--ok-soft);cursor:pointer}
table.matrix td.matrix-cell.on:hover{background:#d6f3e1}
table.matrix .matrix-check{color:var(--ok);font-weight:700;font-size:13px}
.matrix-legend{font-size:12px;color:var(--muted);margin-top:8px}
.stat-field{display:flex;gap:12px;padding:8px 0;border-bottom:1px dashed var(--border)}
.stat-field:last-child{border-bottom:none}
.stat-k{width:80px;flex:none;font-size:12px;color:var(--muted)}
.stat-v{flex:1;font-size:13px;word-break:break-word;white-space:normal}
.stat-task-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;cursor:pointer}
.stat-task-item:hover{background:var(--surface-2)}
.stat-task-label{font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.col-pop{position:fixed;z-index:90;background:#fff;border:1px solid var(--border-2);border-radius:10px;
  box-shadow:0 14px 36px rgba(16,24,40,.18);padding:9px;min-width:196px;max-width:288px}
.col-pop h4{margin:0 0 7px;font-size:12px;font-weight:600;color:var(--muted)}
.col-pop .cp-s{width:100%;height:30px;padding:0 8px;border:1px solid var(--border);border-radius:7px;margin-bottom:7px;font-size:13px}
.col-pop .cp-l{max-height:224px;overflow:auto;margin:0 -3px}
.col-pop label{display:flex;align-items:center;gap:7px;padding:5px 6px;border-radius:6px;cursor:pointer;font-size:13px}
.col-pop label:hover{background:var(--surface-2)}
.col-pop label input{margin:0;flex:none}
.col-pop .cp-v{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col-pop .cp-c{color:var(--faint);font-size:11px;flex:none}
.col-pop .cp-f{display:flex;gap:6px;border-top:1px solid var(--border);margin-top:7px;padding-top:7px}
.col-pop .cp-f button{flex:1;height:29px;border:1px solid var(--border-2);background:#fff;border-radius:7px;font-size:12.5px;color:var(--text)}
.col-pop .cp-f button:hover{background:var(--surface-2)}
/* 手机端：放大点按区域，输入框字号 ≥16px 以免输入法自动缩放页面 */
@media (max-width:820px){
  .col-pop{min-width:0;max-width:calc(100vw - 20px);padding:12px 12px 10px}
  .col-pop h4{font-size:13px;margin-bottom:9px}
  .col-pop .cp-s{height:40px;font-size:16px;margin-bottom:9px}
  .col-pop .cp-l{max-height:34vh}
  .col-pop label{padding:9px 8px;font-size:14px;gap:9px}
  .col-pop label input{width:18px;height:18px}
  .col-pop .cp-c{font-size:12px}
  .col-pop .cp-f button{height:38px;font-size:14px}
}

/* ---------- 应用内文件预览 ---------- */
.pv{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;background:#0f1115;color:#e8eaed}
.pv-bar{display:flex;align-items:center;gap:10px;padding:9px 12px;background:#171a21;
  border-bottom:1px solid #262b36;flex:none;padding-top:calc(9px + env(safe-area-inset-top))}
.pv-title{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.pv-ico{font-size:17px;flex:none}
.pv-name{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-acts{display:flex;gap:8px;flex:none}
.pv-btn{height:32px;padding:0 12px;border-radius:8px;border:1px solid #363c4a;background:#232734;
  color:#e8eaed;font-size:13px;white-space:nowrap}
.pv-btn:hover{background:#2c3140}
.pv-close{width:34px;padding:0;font-size:15px}
.pv-body{flex:1;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center;padding:12px;
  -webkit-overflow-scrolling:touch}
.pv-body.pv-doc{display:block;padding:12px 8px}
.pv-body.pv-fill{padding:0}
.pv-body img{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 8px 30px rgba(0,0,0,.5);cursor:zoom-in}
.pv-body img.pv-zoom{max-width:none;max-height:none;cursor:zoom-out}
.pv-body video{max-width:100%;max-height:100%;background:#000}
.pv-body audio{width:100%;max-width:520px}
.pv-body iframe{width:100%;height:100%;border:0;background:#fff}
.pv-body pre{margin:0;padding:14px;background:#15181f;border-radius:10px;font-size:12.5px;line-height:1.65;
  white-space:pre-wrap;word-break:break-word;width:100%;color:#cfd4dd;font-family:ui-monospace,Menlo,Consolas,monospace}
.pv-page{display:block;width:100%;max-width:960px;height:auto;margin:0 auto 12px;background:#fff;border-radius:4px;
  box-shadow:0 4px 18px rgba(0,0,0,.5)}
.pv-ph{width:100%;max-width:960px;margin:0 auto 12px;background:#1b1f28;border-radius:4px;
  display:flex;align-items:center;justify-content:center;color:#5b6373;font-size:12px}
.pv-tip{text-align:center;color:#9aa3b2;font-size:13.5px;line-height:1.95;padding:26px 18px;max-width:520px}
.pv-tip b{color:#e8eaed;display:block;font-size:15px;margin-bottom:8px;word-break:break-all}
.pv-tip-acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.pv-loading{display:flex;flex-direction:column;align-items:center;gap:12px;color:#9aa3b2;font-size:13px}
.pv-ring{width:28px;height:28px;border:2.5px solid #2b3140;border-top-color:#8496ff;border-radius:50%;
  animation:pvspin .9s linear infinite}
@keyframes pvspin{to{transform:rotate(360deg)}}
.pv-foot{flex:none;padding:7px 12px;text-align:center;color:#8b93a1;font-size:11.5px;background:#141720;
  padding-bottom:calc(7px + env(safe-area-inset-bottom))}
@media (max-width:820px){
  .pv-btn{height:34px;padding:0 10px;font-size:12.5px}
  .pv-name{font-size:13px}
  #pv-ext{display:none}      /* 手机上用「下载」走系统应用更直接 */
  .pv-close{width:36px}
}

.mono{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted)}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:#eef1f4;color:#475467}
.tag-ok{background:var(--ok-soft);color:var(--ok)}
.tag-warn{background:var(--warn-soft);color:var(--warn)}
.tag-primary{background:var(--primary-soft);color:var(--primary-dark)}
.tag-danger{background:var(--danger-soft);color:var(--danger)}
.link-btn{background:none;border:none;color:var(--primary);padding:0 6px;font-size:13px}
.link-btn:hover{text-decoration:underline}
.link-danger{color:var(--danger)}
.empty{padding:44px 20px;text-align:center;color:var(--faint);font-size:13px}
.muted{color:var(--muted)}

/* ---------- 修改记录 ---------- */
.log-list{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.log-item{padding:13px 16px;border-bottom:1px solid var(--border)}
.log-item:last-child{border-bottom:none}
.log-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:7px}
.log-who{font-weight:500}
.log-when{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.log-target{font-size:12px;color:var(--muted)}
.log-diffs{display:flex;flex-direction:column;gap:5px}
.diff{display:flex;align-items:baseline;gap:7px;font-size:13px;flex-wrap:wrap}
.diff .f{color:var(--muted);min-width:74px;flex:none}
.diff .from{color:var(--faint);text-decoration:line-through}
.diff .arrow{color:var(--faint)}
.diff .to{color:var(--text);font-weight:500}
.diff .newv{color:var(--ok);font-weight:500}
.diff .gone{color:var(--danger)}

/* ---------- 弹窗 ---------- */
.overlay{position:fixed;inset:0;background:rgba(16,24,40,.45);display:flex;
  align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;z-index:60}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:640px;
  box-shadow:0 20px 48px rgba(16,24,40,.2);margin:auto}
.modal-head{display:flex;align-items:center;padding:18px 22px;border-bottom:1px solid var(--border)}
.modal-head h3{margin:0;font-size:15px;font-weight:600;flex:1}
.modal-close{background:none;border:none;font-size:20px;color:var(--faint);line-height:1;padding:2px 6px}
.modal-close:hover{color:var(--text)}
.modal-body{padding:20px 22px;max-height:calc(100vh - 210px);overflow-y:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:9px;padding:15px 22px;border-top:1px solid var(--border)}
.import-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:16px}
.import-tab{flex:1;padding:10px 16px;text-align:center;font-size:13px;color:var(--muted);
  background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;transition:color .15s,border-color .15s;font-family:inherit}
.import-tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:500}
.import-dropzone{border:2px dashed var(--border-2);border-radius:12px;padding:36px 20px;text-align:center;
  cursor:pointer;transition:border-color .15s,background .15s}
.import-dropzone:hover,.import-dropzone.dragover{border-color:var(--primary);background:var(--primary-soft)}
.import-dropzone .dz-icon{font-size:28px;margin-bottom:6px}
.import-dropzone .dz-hint{font-size:12px;color:var(--faint);margin-top:4px}
.import-paste{width:100%;min-height:160px;padding:12px;border:1px solid var(--border-2);border-radius:8px;
  font-family:inherit;font-size:13px;resize:vertical;outline:none;line-height:1.5}
.import-paste:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.import-loading{display:flex;align-items:center;justify-content:center;flex-direction:column;
  padding:48px 20px;gap:12px}
.import-loading .spinner{width:28px;height:28px;border:3px solid var(--border-2);
  border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.import-loading .ld-text{font-size:13px;color:var(--muted)}
.import-err{padding:24px 20px;text-align:center}
.import-err p{font-size:13px;color:var(--danger);margin:0 0 12px}
.import-preview-wrap{overflow-x:auto}
.import-preview{width:100%;border-collapse:collapse;font-size:12px;min-width:560px}
.import-preview th{padding:6px 4px;text-align:left;font-weight:500;color:var(--muted);
  border-bottom:1px solid var(--border);font-size:11px;white-space:nowrap}
.import-preview td{padding:3px 4px;border-bottom:1px solid var(--border)}
.import-preview .ip-input{width:100%;height:30px;padding:2px 6px;border:1px solid var(--border-2);
  border-radius:4px;font-size:12px;font-family:inherit;background:var(--surface)}
.import-preview .ip-input:focus{border-color:var(--primary);outline:none}
.import-preview .ip-del{height:26px;padding:0 8px;font-size:11px;border-radius:4px;
  border:1px solid var(--danger);background:var(--danger-soft);color:var(--danger);cursor:pointer;white-space:nowrap}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1 / -1}
.form-grid .field{margin-bottom:0}
textarea.input{height:auto;min-height:74px;padding:9px 12px;resize:vertical;line-height:1.5}
.checks{display:flex;flex-wrap:wrap;gap:12px;padding-top:5px}
.checks label{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--text);cursor:pointer;margin:0}
.att-list{margin-top:8px;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.att-item{display:flex;align-items:center;gap:9px;padding:7px 11px;font-size:13px;border-bottom:1px solid var(--border)}
.att-item:last-child{border-bottom:none}
.att-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drop-hint{border:1px dashed var(--border-2);border-radius:8px;padding:16px;text-align:center;
  color:var(--muted);font-size:13px;background:var(--surface-2);margin-top:8px}
.mini-note{font-size:12px;color:var(--faint);margin-top:6px}

.toast-root{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:90;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#1a1f2b;color:#fff;padding:10px 18px;border-radius:9px;font-size:13px;
  box-shadow:0 8px 24px rgba(16,24,40,.24);max-width:88vw}
.toast.err{background:var(--danger)}
.toast.ok{background:#054f31}

.spin{width:15px;height:15px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;
  border-radius:50%;animation:sp .7s linear infinite;display:inline-block;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

@media (max-width:640px){
  .form-grid{grid-template-columns:1fr}
  .main{padding:16px 12px 50px}
  .app-header-inner,.tabs,.boards{padding:0 12px}
  .boards{padding-top:10px;padding-bottom:10px}
  .board{flex:1;padding:0 10px;font-size:13px}
  .charts{grid-template-columns:1fr}
  .bar-row{grid-template-columns:82px 1fr 44px}
  .login-card{padding:26px 20px}
  .app-title{font-size:14px}
  .user-chip .uname{display:none}
}

/* ---------- 云盘 ---------- */
.crumbs{display:flex;align-items:center;gap:2px;flex-wrap:wrap;margin-bottom:14px;font-size:13px}
.crumb{background:none;border:none;color:var(--primary);padding:3px 6px;border-radius:6px;font-size:13px}
.crumb:hover{background:var(--primary-soft)}
.crumb.on{color:var(--text);font-weight:600;background:none;cursor:default}
.crumb.on:hover{background:none}
.crumb-sep{color:var(--faint)}
.drive-list{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.drow{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--border)}
.drow:last-child{border-bottom:none}
.drow:hover{background:var(--surface-2)}
.dicon{width:30px;height:30px;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:17px;background:#f1f2f6;border-radius:8px}
.dicon.folder{background:var(--primary-soft)}
.dmain{flex:1;min-width:0}
.dname{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.dname-btn{background:none;border:none;padding:0;text-align:left;font-size:14px;color:var(--text);
  max-width:min(60vw,520px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dname-btn:hover{color:var(--primary);text-decoration:underline}
.dmeta{font-size:12px;color:var(--faint);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dact{display:flex;gap:2px;flex:none;align-items:center}
@media (max-width:640px){
  .drow{flex-wrap:wrap;gap:8px}
  .dmain{flex:1 1 58%;min-width:0}
  .dname-btn{max-width:100%}
  .dact{flex:1 1 100%;justify-content:flex-end;margin-top:4px;
    border-top:1px dashed var(--border);padding-top:7px}
}
</style>
</head>

<!-- 补填资料 -->

  <div class="login-card">
    <div class="login-brand">
      <div class="login-logo"><img src="logo.jpg" alt="宣传部徽标"></div>

  function fmtSize(b) {

  async function sendCode() {
    var phone = $('phone-input').value.trim();
    if (!/^1\d{10}$/.test(phone)) { setPhoneError('请输入正确的 11 位手机号'); return; }
    setPhoneError('');
    showLoginMsg('');
    var btn = $('send-code-btn');
    btn.disabled = true;
    btn.textContent = '发送中…';
    try {
      var sent = await cloud.auth.sendOtp({ phone: phone });
      if (sent.error) {
        showLoginMsg(sent.error.message || '验证码发送失败');
        btn.disabled = false; btn.textContent = '获取验证码';
        return;
      }
      pendingOtp = { phone: phone, verificationId: sent.data.verificationId, isExistingUser: sent.data.isExistingUser };
      toast('验证码已发送', 'ok');
      var left = 60;
      btn.textContent = left + ' 秒后重发';
      var timer = setInterval(function () {
        left -= 1;
        if (left <= 0) { clearInterval(timer); btn.disabled = false; btn.textContent = '重新获取'; }
        else btn.textContent = left + ' 秒后重发';
      }, 1000);
    } catch (e) {
      showLoginMsg('发送失败，请稍后重试');
      btn.disabled = false; btn.textContent = '获取验证码';
    }
  }

  async function submitPhone() {
    var phone = $('phone-input').value.trim();
    var token = $('code-input').value.trim();
    var name = $('name-input').value.trim();
    var invite = $('invite-input').value.trim();
    if (!token) { showLoginMsg('请输入短信验证码'); return; }
    if (entryMode === 'register' && !name) { showLoginMsg('请填写姓名，用于台账署名'); return; }
    var pending = pendingOtp;
    if (!pending || pending.phone !== phone) { showLoginMsg('请先获取当前手机号的验证码'); return; }

    showLoginMsg('');
    var btn = $('phone-submit-btn');
    btn.disabled = true;
    btn.textContent = entryMode === 'register' ? '注册中…' : '登录中…';
    try {
      var done = await cloud.auth.verifyOtp({
        phone: pending.phone,
        verificationId: pending.verificationId,
        isExistingUser: pending.isExistingUser,
        token: token
      });
      if (done.error) {
        showLoginMsg(done.error.message || '验证失败，请检查验证码');
        btn.disabled = false; btn.textContent = entryMode === 'register' ? '注册并登录' : '登录';
        return;
      }
      pendingOtp = null;
      state.user = done.data.user;
      state.profile = await fetchMyProfile();

      if (entryMode === 'register') {
        if (!state.profile) {
          state.profile = await createProfile(name);
        }
        if (state.profile && invite) {
          await redeemInvite(invite);
        }
      }
      $('name-input').value = '';
      $('invite-input').value = '';
      $('code-input').value = '';
      btn.disabled = false;
      btn.textContent = entryMode === 'register' ? '注册并登录' : '登录';
      afterAuth();
    } catch (e) {
      showLoginMsg('操作失败，请稍后重试');
      btn.disabled = false; btn.textContent = entryMode === 'register' ? '注册并登录' : '登录';
    }
  }

  var TABLES = { folders: 'folders', files: 'library_files', progress: 'progress', archive: 'archive', announcements: 'announcements' };
  var LOG_TABLE_FIELDS = { progress: 'task', archive: 'project' };

  async function fetchTable(key) {
    var table = TABLES[key];
    var PAGE = 200;
    var all = [];
    var offset = 0;
    while (true) {
      var res = await cloud.database.from(table).select('*')
        .order('id', { ascending: true }).range(offset, offset + PAGE - 1);
      if (res.error) { toast('读取失败：' + res.error.message, 'err'); return all; }
      var rows = res.data || [];
      all = all.concat(rows);
      if (rows.length < PAGE) break;
      offset += PAGE;
      if (offset > 5000) break;
    }
    return all;
  }
  async function fetchLogs(opts) {
    opts = opts || {};
    var q = cloud.database.from('progress_log').select('*');
    if (opts.table) q = q.eq('table_name', opts.table);
    if (opts.recordId != null) q = q.eq('record_id', opts.recordId);
    var res = await q.order('id', { ascending: false }).limit(opts.limit || 200);
    if (res.error) { toast('读取修改记录失败：' + res.error.message, 'err'); return []; }
    return res.data || [];
  }
  async function loadAll() {
    var jobs = [fetchTable('progress'), fetchTable('archive'), fetchLogs({ limit: 200 }), fetchTable('announcements')];
    if (isMinister()) { jobs.push(fetchTable('folders')); jobs.push(fetchTable('files')); }
    var r = await Promise.all(jobs);
    state.progress = r[0]; state.archive = r[1]; state.logs = r[2];
    state.announcements = (r[3] || []).slice().sort(function (a, b) { return (b.id || 0) - (a.id || 0); });
    if (isMinister()) {
      state.folders = r[4] || [];
      state.files = r[5] || [];

    render();
  }

  /* ---------------- 表单 ---------------- */
  function fieldNode(f, value) {
    var wrap = el('div', { cls: 'field' + (f.full ? ' full' : '') });
    wrap.appendChild(el('label', { text: f.label + (f.required ? ' *' : '') }));
    var input;
    if (f.type === 'textarea') {
      input = el('textarea', { cls: 'input', attrs: { rows: '3' } });
      input.value = value == null ? '' : String(value);
    } else if (f.type === 'select') {
      input = el('select', { cls: 'input' });
      input.appendChild(el('option', { text: '未指定', attrs: { value: '' } }));
      f.options.forEach(function (o) {
        var op = el('option', { text: o, attrs: { value: o } });
        if (o === value) op.selected = true;
        input.appendChild(op);
      });
    } else if (f.type === 'checks') {
      input = el('div', { cls: 'checks' });
      var cur = Array.isArray(value) ? value : [];
      f.options.forEach(function (o) {
        var id = 'ck_' + f.key + '_' + Math.random().toString(36).slice(2, 7);
        var cb = el('input', { attrs: { type: 'checkbox', value: o, id: id } });
        if (cur.indexOf(o) >= 0) cb.checked = true;
        input.appendChild(el('label', { attrs: { for: id } }, [cb, el('span', { text: o })]));
      });
    } else {
      input = el('input', { cls: 'input', attrs: { type: f.type === 'number' ? 'number' : (f.type === 'date' ? 'date' : 'text') } });
      if (f.ph) input.setAttribute('placeholder', f.ph);
      if (f.type === 'number') input.setAttribute('step', 'any');
      input.value = value == null ? '' : String(value);
    }
    input.dataset.fieldKey = f.key;
    input.dataset.fieldType = f.type;
    wrap.appendChild(input);
    return wrap;
  }

  function collectForm(container, fields) {
    var out = {};
    fields.forEach(function (f) {
      var node = container.querySelector('[data-field-key="' + f.key + '"]');
      if (!node) return;
      if (f.type === 'checks') {
        out[f.key] = Array.prototype.slice.call(node.querySelectorAll('input:checked')).map(function (i) { return i.value; });
      } else if (f.type === 'number') {
        out[f.key] = node.value === '' ? null : Number(node.value);
      } else if (f.type === 'date') {
        out[f.key] = node.value || null;
      } else {
        out[f.key] = node.value;
      }
    });
    return out;
  }

    clear(modalRoot);
    modalRoot.appendChild(overlay);
    document.body.style.overflow = 'hidden';

    mountModal(modalShell(opts.title, body, el('div', { cls: 'modal-foot' }, [

        if (!txt) { toast('请先粘贴文本', 'err'); return; }
        runAI(txt, null);
      });
    }

    function renderLoading(text) {
      clear(contentArea);
      contentArea.appendChild(el('div', { cls: 'import-loading' }, [
        el('div', { cls: 'spinner' }),
        el('div', { cls: 'ld-text', text: text || 'AI 正在识别任务…' })
      ]));
    }

    function renderError(msg) {
      clear(contentArea);
      var retryBtn = el('button', { cls: 'btn btn-sm btn-ghost', text: '返回重试', attrs: { type: 'button' } });
      retryBtn.addEventListener('click', function () { renderUploadView(); switchTabs('upload'); });
      contentArea.appendChild(el('div', { cls: 'import-err' }, [
        el('p', { text: msg }),
        retryBtn
      ]));
    }

    async function handleFile(file) {
      var name = (file.name || '').toLowerCase();
      if (name.match(/\.(png|jpg|jpeg|gif|bmp|webp)$/)) {
        var reader = new FileReader();
        reader.onload = function () { runAI(null, reader.result); };
        reader.readAsDataURL(file);
      } else if (name.match(/\.docx$/)) {
        renderLoading('正在解析 Word 文档…');
        try {
          var arrayBuffer = await file.arrayBuffer();
          var result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
          var text = result.value;
          if (!text || text.trim().length < 10) { renderError('文档内容为空或无法解析'); return; }
          runAI(text, null);
        } catch (e) {
          renderError('Word 解析失败：' + (e.message || e));
        }
      } else {
        toast('不支持的文件格式，请上传 .docx 或图片文件', 'err');
      }
    }

    async function runAI(textContent, imageDataUrl) {
      renderLoading('AI 正在识别任务分配…');
      try {
        var userContent;
        if (imageDataUrl) {
          userContent = [
            { type: 'text', text: '请从这张会议记录图片中提取任务分配信息。' },
            { type: 'image_url', image_url: { url: imageDataUrl } }
          ];
        } else {
          userContent = '请从以下会议记录中提取任务分配信息：\n\n' + textContent;
        }
        var messages = [
          { role: 'system', content: SYS_PROMPT },
          { role: 'user', content: userContent }
        ];
        /* 模型 space-bunny：官方标称推理速度极快，支持图片。
           推理强度设为 medium（默认 max，对结构化提取任务 medium 足够且更快）。
           答案可能出现在 delta.content 或 delta.reasoning 中，同时收集两路文本。 */
        var fullContent = '';
        var fullReasoning = '';
        var lastTick = 0;
        var streamPromise = (async function () {
          for await (var chunk of cloud.llm.chat.completions.create({
            model: 'space-bunny',
            messages: messages,
            stream: true,
            reasoning: { effort: 'medium' }
          })) {
            var delta = chunk.choices && chunk.choices[0] && chunk.choices[0].delta;
            if (!delta) continue;
            if (delta.content) fullContent += delta.content;
            if (delta.reasoning) fullReasoning += delta.reasoning;
            if (delta.reasoning_content) fullReasoning += delta.reasoning_content;
            var now = Date.now();
            if (now - lastTick > 1000) {
              lastTick = now;
              var ld = contentArea.querySelector('.ld-text');
              if (ld) ld.textContent = 'AI 正在识别任务分配…（已接收 ' + (fullContent.length + fullReasoning.length) + ' 字符，约需 10~30 秒）';
            }
          }
        })();
        var timeoutPromise = new Promise(function (_, reject) {
          setTimeout(function () { reject(new Error('AI 响应超时（120 秒），请稍后重试')); }, 120000);
        });
        await Promise.race([streamPromise, timeoutPromise]);

        /* 优先从 content 找 JSON，找不到再从 reasoning 找 */
        var jsonStr = '';
        var candidates = [fullContent, fullReasoning, fullContent + fullReasoning];
        for (var ci = 0; ci < candidates.length; ci++) {
          var txt = candidates[ci].trim();
          if (!txt) continue;
          var jsonMatch = txt.match(/\{[\s\S]*\}/);
          if (jsonMatch) { jsonStr = jsonMatch[0]; break; }
        }
        if (!jsonStr) {
          renderError('AI 返回内容未包含有效的任务 JSON。请检查文件内容是否为会议纪要，或稍后重试。');
          return;
        }
        var parsed = JSON.parse(jsonStr);
        var tasks = parsed.tasks || [];
        if (tasks.length === 0) {
          renderError('未识别到任务分配信息。请确认文件内容包含明确的任务分配。');
          return;
        }
        renderPreview(tasks);
      } catch (e) {
        renderError('AI 识别失败：' + (e.message || e));
      }
    }

    var confirmBtn = el('button', { cls: 'btn', text: '确认导入', attrs: { type: 'button', disabled: true } });

    function renderPreview(tasks) {
      clear(contentArea);
      var cols = [
        { key: 'project', label: '项目名称' },
        { key: 'task', label: '工作事项' },
        { key: 'participants', label: '参与人员' },
        { key: 'start_date', label: '开始时间' },
        { key: 'note', label: '备注' }
      ];
      var thead = el('thead', {}, [el('tr', {}, cols.map(function (c) {
        return el('th', { text: c.label });
      }).concat([el('th', { text: '' })]))]);
      var tbody = el('tbody', {});
      var table = el('table', { cls: 'import-preview' }, [thead, tbody]);

      function renderRow(task) {
        var inputs = {};
        cols.forEach(function (c) {
          inputs[c.key] = el('input', { cls: 'ip-input', attrs: { type: 'text', value: task[c.key] || '' } });
        });
        var delBtn = el('button', { cls: 'ip-del', text: '删除', attrs: { type: 'button' } });
        delBtn.addEventListener('click', function () {
          var row = delBtn.parentNode;
          if (row) row.parentNode.removeChild(row);
        });
        var tr = el('tr', {}, cols.map(function (c) {
          return el('td', {}, [inputs[c.key]]);
        }).concat([el('td', {}, [delBtn])]));
        tr._getValues = function () {
          var v = {};
          cols.forEach(function (c) { v[c.key] = inputs[c.key].value.trim(); });
          return v;
        };
        return tr;
      }

      tasks.forEach(function (task) { tbody.appendChild(renderRow(task)); });

      var addRowBtn = el('button', { cls: 'btn btn-sm btn-ghost', text: '+ 添加一行', attrs: { type: 'button', style: 'margin-top:8px' } });
      addRowBtn.addEventListener('click', function () {
        tbody.appendChild(renderRow({ project: '', task: '', participants: '', start_date: '', note: '' }));
      });

      contentArea.appendChild(el('div', { cls: 'import-preview-wrap' }, [table]));
      contentArea.appendChild(addRowBtn);
      contentArea.appendChild(el('div', { cls: 'mini-note', text: '识别结果可编辑，确认无误后点击「确认导入」', attrs: { style: 'margin-top:8px' } }));

      confirmBtn.disabled = false;
      confirmBtn.textContent = '确认导入';
      confirmBtn._doImport = async function () {
        var rows = tbody.querySelectorAll('tr');
        var vals = [];
        for (var i = 0; i < rows.length; i++) {
          if (rows[i]._getValues) {
            var v = rows[i]._getValues();
            if (v.task || v.project) {
              v.status = '🤍 未开始';
              if (!v.start_date) v.start_date = '';
              vals.push(v);
            }
          }
        }
        if (vals.length === 0) { toast('没有可导入的任务', 'err'); return; }
        confirmBtn.disabled = true; confirmBtn.textContent = '导入中…';
        var ok = 0, fail = 0;
        for (var j = 0; j < vals.length; j++) {
          var r = await insertRow('progress', vals[j]);
          if (r) ok++; else fail++;
        }
        confirmBtn.disabled = false; confirmBtn.textContent = '确认导入';
        if (ok > 0) {
          closeModal();
          toast('成功导入 ' + ok + ' 条任务' + (fail > 0 ? '，' + fail + ' 条失败' : ''), 'ok');
          loadAll();
        } else {
          toast('导入失败', 'err');
        }
      };
    }

    var tabUpload, tabPaste;
    function switchTabs(active) {
      tabUpload.classList.toggle('active', active === 'upload');
      tabPaste.classList.toggle('active', active === 'paste');
      if (active === 'upload') renderUploadView();
      else renderPasteView();
    }

    confirmBtn.addEventListener('click', function () {
      if (confirmBtn._doImport) confirmBtn._doImport();
    });

    var modalBody = el('div', { cls: 'modal-body' });
    tabUpload = el('button', { cls: 'import-tab active', text: '上传文件', attrs: { type: 'button' } });
    tabPaste = el('button', { cls: 'import-tab', text: '粘贴文本', attrs: { type: 'button' } });
    tabUpload.addEventListener('click', function () { switchTabs('upload'); });
    tabPaste.addEventListener('click', function () { switchTabs('paste'); });
    modalBody.appendChild(el('div', { cls: 'import-tabs' }, [tabUpload, tabPaste]));
    modalBody.appendChild(contentArea);

    var foot = el('div', { cls: 'modal-foot' }, [
      el('button', { cls: 'btn btn-ghost', text: '取消', attrs: { type: 'button' }, on: { click: closeModal } }),
      confirmBtn
    ]);

    renderUploadView();
    mountModal(modalShell('AI 一键导入任务', modalBody, foot));
  }

  function confirmDelete(key, id, label) {
    var btn = el('button', { cls: 'btn btn-danger', text: '确认删除', attrs: { type: 'button' } });
    btn.addEventListener('click', async function () {

  /* ---------------- 单条事项归档：写入历史归档 + 从工作总览移除 ---------------- */
  function openArchiveModal(rec) {
    var pre = {
      archive_date: new Date().toISOString().slice(0, 10),
      project: rec.project || '',
      participants: mergeNames([rec.participants, rec.responsible, rec.collaborators]).join('、'),
      result: rec.latest || rec.task || '',

    };

    var grid = el('div', { cls: 'form-grid' });

    var btn = el('button', { cls: 'btn', text: '确认归档', attrs: { type: 'button' } });

      btn
    ])));

  /* ---------------- 修改记录渲染 ---------------- */
  function recordLabel(tableName, recordId) {
    var list = tableName === 'progress' ? state.progress : state.archive;
    var f = LOG_TABLE_FIELDS[tableName] || 'task';
    for (var i = 0; i < list.length; i++) {
      if (String(list[i].id) === String(recordId)) return list[i][f] || list[i].project || ('#' + recordId);
    }
    return '#' + recordId + '（记录已删除）';
  }
  function diffNodes(changes) {
    var box = el('div', { cls: 'log-diffs' });
    if (!Array.isArray(changes) || !changes.length) {
      box.appendChild(el('div', { cls: 'muted', text: '（无字段级变化）' }));
      return box;
    }
    changes.forEach(function (c) {
      var row = el('div', { cls: 'diff' }, [el('span', { cls: 'f', text: c.field || '' })]);
      var hasFrom = c.from != null && String(c.from) !== '';
      var hasTo = c.to != null && String(c.to) !== '';
      if (!hasFrom && hasTo) {
        row.appendChild(el('span', { cls: 'newv', text: '设为 ' + c.to }));
      } else if (hasFrom && !hasTo) {
        row.appendChild(el('span', { cls: 'gone', text: '清空（原 ' + c.from + '）' }));
      } else {
        row.appendChild(el('span', { cls: 'from', text: String(c.from) }));
        row.appendChild(el('span', { cls: 'arrow', text: '→' }));
        row.appendChild(el('span', { cls: 'to', text: String(c.to) }));
      }
      box.appendChild(row);
    });
    return box;
  }
  function logItemNode(lg) {
    var actCls = lg.action === 'delete' ? 'tag tag-danger' : (lg.action === 'insert' ? 'tag tag-ok' : 'tag tag-warn');
    var head = el('div', { cls: 'log-head' }, [
      el('span', { cls: 'log-who', text: lg.actor_name || '未署名' }),
      el('span', { cls: actCls, text: ACTION_LABEL[lg.action] || lg.action }),
      el('span', { cls: 'log-target', text: (lg.table_name === 'progress' ? '工作总览 · ' : '历史归档 · ') + recordLabel(lg.table_name, lg.record_id) }),
      el('span', { cls: 'log-when', text: fmtTime(lg.created_at) })
    ]);
    return el('div', { cls: 'log-item' }, [head, diffNodes(lg.changes)]);
  }
  async function openRecordHistory(tableName, recordId, label) {
    var body = el('div', { cls: 'modal-body' }, [el('div', { cls: 'empty', text: '正在读取…' })]);
    mountModal(modalShell('修改历史 · ' + label, body, el('div', { cls: 'modal-foot' }, [
      el('button', { cls: 'btn btn-ghost', text: '关闭', attrs: { type: 'button' }, on: { click: closeModal } })
    ])));
    var rows = await fetchLogs({ table: tableName, recordId: recordId, limit: 200 });
    clear(body);
    if (!rows.length) { body.appendChild(el('div', { cls: 'empty', text: '这条记录还没有修改历史' })); return; }
    var list = el('div', { cls: 'log-list' });

  /* ---------------- 渲染 ---------------- */
  function render() {
    renderDrive();
    renderOverview();
    renderProgress();
    renderStats();
    renderArchive();
    renderLogs();
    renderAnnBar();
    paintBoardBadges();
  }
  function paintBoardBadges() {
    Array.prototype.forEach.call($('boards').children, function (btn) {
      var key = btn.dataset.board;
      var span = btn.querySelector('.cnt');
      var txt = boardBadge(key);
      if (!span) {
        if (txt) btn.appendChild(el('span', { cls: 'cnt', text: txt }));
      } else if (txt) {
        span.textContent = txt;
      } else if (span.parentNode) {
        span.parentNode.removeChild(span);
      }
    });
  }
  function buildBoards() {
    var boardsHost = $('boards');
    clear(boardsHost);
    var visible = BOARDS.filter(function (b) { return !b.ministerOnly || isMinister(); });
    if (!state.board || !visible.some(function (b) { return b.key === state.board; })) {
      state.board = visible.length ? visible[0].key : null;
    }
    visible.forEach(function (b) {
      var btn = el('button', { cls: 'board' + (b.key === state.board ? ' on' : ''), attrs: { type: 'button', 'data-board': b.key } });
      btn.appendChild(el('span', { text: b.label }));
      var badge = boardBadge(b.key);
      if (badge) btn.appendChild(el('span', { cls: 'cnt', text: badge }));
      btn.addEventListener('click', function () { switchBoard(b.key); });
      boardsHost.appendChild(btn);
    });
    buildTabs();
    loadAll();
  }
  function boardBadge(key) {
    if (key === 'lib') return state.files.length ? String(state.files.length) : '';
    return state.progress.length ? String(state.progress.length) : '';
  }
  function currentBoard() {
    for (var i = 0; i < BOARDS.length; i++) if (BOARDS[i].key === state.board) return BOARDS[i];
    return null;
  }
  function buildTabs() {
    var tabsHost = $('tabs');
    clear(tabsHost);
    var b = currentBoard();
    if (!b) return;
    if (!state.tab || !b.tabs.some(function (t) { return t.key === state.tab; })) state.tab = b.tabs[0].key;
    b.tabs.forEach(function (t) {
      var btn = el('button', { cls: 'tab' + (t.key === state.tab ? ' active' : ''), text: t.label, attrs: { type: 'button', 'data-tab': t.key } });

  function switchBoard(key) {
    if (state.board === key) return;

    state.tab = null;
    Array.prototype.forEach.call($('boards').children, function (b) {
      b.className = 'board' + (b.dataset.board === key ? ' on' : '');

  function switchTab(tab) {
    state.tab = tab;

  function applyTabVisibility() {

  function statusTag(status) {
    var cls = 'tag';
    if (status === '已发布' || status === '💚 已完成') cls = 'tag tag-ok';
    else if (status === '制作中' || status === '待审核' || status === '💛 进行中') cls = 'tag tag-warn';
    else if (status === '已归档') cls = 'tag';
    return el('span', { cls: cls, text: status || '—' });
  }

  function barChart(title, pairs) {
    var panel = el('div', { cls: 'panel' }, [el('h3', { text: title })]);
    if (!pairs.length) { panel.appendChild(el('div', { cls: 'empty', text: '暂无数据' })); return panel; }
    var max = pairs.reduce(function (m, p) { return Math.max(m, p[1]); }, 0) || 1;
    pairs.forEach(function (p) {
      var fill = el('div', { cls: 'bar-fill' });
      fill.style.width = Math.round(p[1] / max * 100) + '%';
      panel.appendChild(el('div', { cls: 'bar-row' }, [
        el('span', { text: p[0] }),
        el('div', { cls: 'bar-track' }, [fill]),
        el('span', { cls: 'bar-num', text: p[1] })
      ]));
    });
    return panel;
  }
  function countBy(list, key) {
    var m = {};
    list.forEach(function (r) { var v = r[key]; if (!v) v = '未填写'; m[v] = (m[v] || 0) + 1; });
    return Object.keys(m).map(function (k) { return [k, m[k]]; }).sort(function (a, b) { return b[1] - a[1]; });
  }

  function fileTypePairs(list) {
    var m = {};
    list.forEach(function (f) { var k = fileKind(f.name).label; m[k] = (m[k] || 0) + 1; });
    return Object.keys(m).map(function (k) { return [k, m[k]]; }).sort(function (a, b) { return b[1] - a[1]; });
  }

  function renderOverview() {

    var doing = P.filter(function (r) { return r.status === '💛 进行中'; }).length;
    var done = P.filter(function (r) { return r.status === '💚 已完成'; }).length;

    var stats = el('div', { cls: 'stats' });
    [
      ['文件夹', F.length, '个'],
      ['文件总数', FS.length, '个'],
      ['已上传实体', uploaded.length, '个'],
      ['待上传', pending.length, '个'],
      ['资料总容量', fmtSize2(totalSize), ''],
      ['工作总览', P.length, '条'],
      ['进行中', doing, '条'],
      ['已完成', done, '条']
    ].forEach(function (s) {
      stats.appendChild(el('div', { cls: 'stat' }, [
        el('div', { cls: 'k', text: s[0] }),
        el('div', { cls: 'v', text: typeof s[1] === 'number' ? s[1].toLocaleString('zh-CN') : s[1] },
          [el('span', { cls: 'u', text: s[2] })])
      ]));
    });
    host.appendChild(stats);

    var charts = el('div', { cls: 'charts' });
    charts.appendChild(barChart('文件夹分类分布', countBy(F, 'category')));
    charts.appendChild(barChart('文件类型分布', fileTypePairs(FS)));
    charts.appendChild(barChart('工作进度状态', countBy(P, 'status')));
    host.appendChild(charts);

    if (pending.length) {
      var box = el('div', { cls: 'panel' }, [el('h3', { text: '待上传实体的文件（' + pending.length + '）' })]);
      box.appendChild(el('div', {
        cls: 'muted', attrs: { style: 'font-size:13px;margin-bottom:10px' },
        text: '这些条目已登记在云盘结构里，但文件本体还没上传。到「云盘」页点「同步本地文件夹」，选一次本地资料夹即可一次性补齐。'
      }));
      var ul = el('div', { cls: 'att-list' });
      pending.slice(0, 12).forEach(function (f) {

  /* 构建一张工作表：彩色表头 + 每列筛选 ▼ + 斑马纹 */

  /* 列筛选浮层 */
  var colPop = null, colPopAnchor = null;

  /* 是否手机端环境（触摸 + 窄屏）。这类环境下输入法弹出会连带触发 WebView 的
     resize / scroll，若此时把浮层（连同里面的输入框）从 DOM 移除，输入法会因为
     焦点目标突然消失而闪退。因此手机端只要焦点还在浮层内就不关闭，只重新定位。 */
  var CP_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  function cpMobile() {

    return CP_TOUCH && Math.min(window.innerWidth, sw) <= 820;

    if (!colPop) return false;

  }

    if (cpMobile() && colPopFocused()) return;
    closeColPop();
  }

  /* 按锚点摆放浮层；键盘顶起页面后也用它保证浮层不被挡住 */
  function placeColPop() {
    if (!colPop || !colPopAnchor) return;
    var vv = window.visualViewport;
    var vw = (vv && vv.width) || window.innerWidth;
    var vh = (vv && vv.height) || window.innerHeight;
    var r = colPopAnchor.getBoundingClientRect();
    var pw = colPop.offsetWidth, ph = colPop.offsetHeight;
    var left = Math.max(8, Math.min(r.left - 8, vw - pw - 10));
    var top = r.bottom + 6;
    if (top + ph > vh - 8) top = r.top - ph - 6;
    if (top < 8 || top + ph > vh - 8) top = Math.max(8, vh - ph - 8);
    colPop.style.left = left + 'px';
    colPop.style.top = top + 'px';
  }

  function openColFilter(tableKey, col, cols, allRecs, anchor, repaint) {
    if (colPop && colPop.getAttribute('data-for') === tableKey + '|' + col.key) { closeColPop(); return; }
    closeColPop();

    var counts = {}, all = [];
    allRecs.forEach(function (r) {
      var v = colText(col, r);
      if (!(v in counts)) { counts[v] = 0; all.push(v); }
      counts[v]++;
    });
    all.sort(function (a, b) { return a.localeCompare(b, 'zh-CN'); });

    var cur = sheetFilters[tableKey][col.key];
    var sel = {};
    (cur && cur.length ? cur : all).forEach(function (v) { sel[v] = true; });

    function commit() {
      var picked = all.filter(function (v) { return sel[v]; });
      if (!picked.length || picked.length === all.length) delete sheetFilters[tableKey][col.key];
      else sheetFilters[tableKey][col.key] = picked;
      repaint();
    }

    var pop = el('div', { cls: 'col-pop', attrs: { 'data-for': tableKey + '|' + col.key } });
    pop.appendChild(el('h4', { text: col.label + ' · 筛选' }));
    var search = el('input', { cls: 'cp-s', attrs: { type: 'text', placeholder: '搜索取值…' } });
    pop.appendChild(search);
    var listBox = el('div', { cls: 'cp-l' });
    pop.appendChild(listBox);

    function paintList() {
      clear(listBox);
      var kw = search.value.trim().toLowerCase();
      var shown = all.filter(function (v) { return !kw || v.toLowerCase().indexOf(kw) >= 0; });
      if (!shown.length) { listBox.appendChild(el('div', { cls: 'cp-c', text: '无匹配取值' })); return; }
      shown.forEach(function (v) {
        var cb = el('input', { attrs: { type: 'checkbox' } });
        cb.checked = !!sel[v];
        cb.addEventListener('change', function () { sel[v] = cb.checked; commit(); });
        listBox.appendChild(el('label', {}, [
          cb,
          el('span', { cls: 'cp-v', text: v || '（空）' }),
          el('span', { cls: 'cp-c', text: String(counts[v]) })

    paintList();

    var allBtn = el('button', { text: '全选', attrs: { type: 'button' } });
    allBtn.addEventListener('click', function () {
      all.forEach(function (v) { sel[v] = true; });

      paintList(); repaint();
    });
    var noneBtn = el('button', { text: '清空', attrs: { type: 'button' } });
    noneBtn.addEventListener('click', function () {

      paintList(); commit();
    });
    pop.appendChild(el('div', { cls: 'cp-f' }, [allBtn, noneBtn]));

    document.body.appendChild(pop);

  document.addEventListener('click', function (e) {

  /* ---------------- 资料库 · 云盘 ---------------- */
  function myUid() { return (state.user && (state.user.id || state.user.uid)) || null; }
  function safeName(n) { return String(n || 'file').replace(/[\\/:*?"<>|]/g, '_').slice(0, 120); }

  function slugFor(name) {
    var base = String(name || '').replace(/\.[^.]+$/, '');
    return base.replace(/[^A-Za-z0-9\u4e00-\u9fa5]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
  }
  /* 对象名只保留 ASCII / 中文：全角标点（（）、：）等会被服务端拒绝，导致上传失败。
     界面显示的文件名不受影响，仍按 library_files.name 原样展示。 */
  function newStoragePath(name) {
    var uid = myUid();
    var m = String(name || '').match(/\.([A-Za-z0-9]{1,10})$/);
    var ext = m ? '.' + m[1].toLowerCase() : '';
    var slug = slugFor(name);
    var key = Date.now().toString(36) + Math.random().toString(36).slice(2, 6) + (slug ? '-' + slug : '');
    return cloud.storage.sharedPath(uid, 'library/' + key + ext);
  }
  async function storagePut(path, file) {
    var up = await cloud.storage.upload(path, file, {
      contentType: file.type || 'application/octet-stream', upsert: true
    });
    if (up && up.error) throw new Error(up.error.message || '上传失败');
    return path;
  }
  async function storageSignedUrl(path) {
    var s = await cloud.storage.createSignedUrl(path, 3600);
    if (s && s.error) throw new Error(s.error.message || '无法获取文件地址');
    var d = (s && s.data) || {};
    var url = d.signedUrl || d.url || d.signedURL;
    if (!url) throw new Error('无法获取文件地址');
    return url;
  }
  async function storageRemove(path) {
    if (!path) return;
    try { await cloud.storage.remove([path]); } catch (e) { /* 存储删除失败不阻断 */ }
  }
  async function storageBlob(path) {
    var r = await cloud.storage.download(path);
    if (r && r.error) throw new Error(r.error.message || '读取失败');
    var b = r && r.data;
    if (!b) throw new Error('读取失败');
    if (typeof b.blob === 'function') b = await b.blob();
    return b;
  }

  /* ================= 应用内文件预览 =================
     以前用 window.open(签名地址) 打开：在手机 APK 里会被系统浏览器接管，
     遇到 octet-stream / attachment 就变成「先下载再打开」。改成在页面内渲染。 */
  var pvState = { rec: null, url: null, token: 0, pdf: null };

  function pvKind(f) {
    var m = String(f.mime || '').toLowerCase();
    var n = String(f.name || '').toLowerCase();
    var ext = (n.match(/\.([a-z0-9]+)$/) || [null, ''])[1];
    if (/^image\//.test(m) || /^(png|jpe?g|gif|webp|bmp|svg|ico|avif)$/.test(ext)) return 'image';
    if (/^video\//.test(m) || /^(mp4|m4v|mov|webm|mkv|avi|3gp)$/.test(ext)) return 'video';
    if (/^audio\//.test(m) || /^(mp3|wav|m4a|aac|ogg|oga|flac)$/.test(ext)) return 'audio';
    if (m === 'application/pdf' || ext === 'pdf') return 'pdf';
    if (/^text\//.test(m) || /^(txt|md|markdown|csv|tsv|json|xml|log|ini|yml|yaml|js|mjs|css|html?|py|java|sql|sh)$/.test(ext)) return 'text';
    if (ext === 'docx') return 'docx';
    return 'other';
  }
  var PV_ICON = { image: '🖼', video: '🎬', audio: '🎵', pdf: '📕', text: '📄', docx: '📘', other: '📎' };

  /* Android WebView 没有内置 PDF 阅读器（navigator.pdfViewerEnabled === false），

    return navigator.pdfViewerEnabled !== false;
  }
  function isMobileLike() {
    return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || '');
  }

  /* 把「签名地址直接当 iframe src」换成「自己取字节 → 造一个受控 MIME 的 blob 地址」。
     原因（实测复现）：对象存储的响应有两类会毁掉 iframe 预览——
       ① 响应头带 X-Frame-Options / CSP，浏览器拒绝被嵌套 → 预览区一片空白；
       ② Content-Type 是 octet-stream 或带 attachment → 被静默转成「下载」，预览区同样空白。
     而以前用新标签页打开是顶层导航，这两条都管不到它，所以电脑上「以前能直接看」。
     blob: 地址是同源的，既不会被拒绝嵌套，MIME 也由我们说了算。 */
  function toBlobUrl(blob, mime) {

  }

  var pdfjsPromise = null;

      document.head.appendChild(s);

    return pdfjsPromise;
  }

  function pvBusy(text) {
    var body = $('pv-body');
    clear(body);
    body.className = 'pv-body';
    body.appendChild(el('div', { cls: 'pv-loading' }, [
      el('div', { cls: 'pv-ring' }), el('span', { text: text })
    ]));
  }
  function pvTip(title, desc) {
    var body = $('pv-body');
    clear(body);
    body.className = 'pv-body';

  function pvAlive(token) { return token === pvState.token && !$('pv-view').hidden; }

  function cleanupPv() {
    if (pvState.url && /^blob:/.test(pvState.url)) { try { URL.revokeObjectURL(pvState.url); } catch (e) {} }
    pvState.url = null;
    if (pvState.pdf) { try { pvState.pdf.destroy(); } catch (e) {} pvState.pdf = null; }
    var b = $('pv-body');
    clear(b);
    b.className = 'pv-body';
  }

  function closePreview(fromPop) {
    if ($('pv-view').hidden) return;

      try { history.back(); } catch (e) {}
    }
  }

  function openPreview(f) {
    pvState.token++;
    var token = pvState.token;
    pvState.rec = f;

    $('pv-view').hidden = false;
    document.body.style.overflow = 'hidden';
    $('pv-name').textContent = f.name || '未命名文件';
    var kind = pvKind(f);
    $('pv-ico').textContent = PV_ICON[kind] || '📎';
    $('pv-ext').textContent = isMobileLike() ? '用其它应用打开' : '新窗口打开';
    $('pv-foot').textContent = '';
    pvBusy('正在获取文件地址…');

    try { history.pushState({ pv: 1 }, ''); } catch (e) {}

    storageSignedUrl(f.storage_path).then(function (url) {
      if (!pvAlive(token)) return;
      pvState.url = url;
      if (kind === 'image') return renderImage(url, token);
      if (kind === 'video') return renderMedia('video', url, token);
      if (kind === 'audio') return renderMedia('audio', url, token);
      if (kind === 'text') return renderText(f, token);
      if (kind === 'docx') return renderDocx(f, token);
      if (kind === 'pdf') return renderPdf(f, url, token);
      return renderOther(f, token);
    }).catch(function (e) {
      if (pvAlive(token)) pvTip('无法打开', (e && e.message) || '获取文件地址失败');
    });
  }

  function renderImage(url, token) {
    if (!pvAlive(token)) return;
    var body = $('pv-body');
    clear(body);
    body.className = 'pv-body';
    var retried = false;

  var PDF_BLOB_MAX = 150 * 1024 * 1024;

  function renderPdf(f, url, token) {
    var native = pvNativePdf();
    if (f.size && f.size > PDF_BLOB_MAX) {
      pvTip('这本 PDF 比较大（' + fmtSize(f.size) + '）',

      if (!native) {
        return loadPdfJs().then(function (lib) {
          return renderPdfPages(lib, blob, token);
        }).catch(function (e) {
          if (pvAlive(token)) pvTip('PDF 预览失败', ((e && e.message) || '') + '。可以用右上角「下载」拿到原文件。');

    }).catch(function () {

  async function renderPdfPages(lib, blob, token) {
    if (!blob) {
      pvBusy('正在读取 PDF…');
      blob = await storageBlob(pvState.rec.storage_path);
      if (!pvAlive(token)) return;
    }
    var buf = await blob.arrayBuffer();
    if (!pvAlive(token)) return;
    pvBusy('正在解析 PDF…');
    var pdf = await lib.getDocument({ data: new Uint8Array(buf) }).promise;
    if (!pvAlive(token)) { try { pdf.destroy(); } catch (e) {} return; }
    pvState.pdf = pdf;

    var body = $('pv-body');
    clear(body);
    body.className = 'pv-body pv-doc';

    var total = pdf.numPages;
    /* 先量出第一页比例，用占位块撑出滚动高度，滚动到哪页渲染哪页，避免一次性吃掉内存 */
    var first = await pdf.getPage(1);
    var vp1 = first.getViewport({ scale: 1 });
    var ratio = vp1.height / vp1.width;

    var holders = [];
    for (var p = 1; p <= total; p++) {
      var ph = el('div', { cls: 'pv-ph', attrs: { 'data-p': String(p) } });
      ph.textContent = '第 ' + p + ' 页';
      body.appendChild(ph);
      holders.push(ph);
    }

    function sizeHolder(holder) {
      var w = Math.min(body.clientWidth - 16, 960);
      holder.style.height = Math.round(w * ratio) + 'px';
    }
    holders.forEach(sizeHolder);

    var rendering = {};
    async function renderPage(num, holder) {
      if (rendering[num] || !pvAlive(token)) return;
      rendering[num] = true;
      try {
        var page = await pdf.getPage(num);
        if (!pvAlive(token)) return;
        var w = Math.min(body.clientWidth - 16, 960);
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        var vp2 = page.getViewport({ scale: 1 });
        var scale = (w / vp2.width) * dpr;
        var vp = page.getViewport({ scale: scale });
        var c = document.createElement('canvas');
        c.className = 'pv-page';
        c.width = Math.floor(vp.width);
        c.height = Math.floor(vp.height);
        holder.className = '';
        holder.style.height = '';
        holder.appendChild(c);
        await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
      } catch (e) {
        holder.textContent = '第 ' + num + ' 页渲染失败';
      }
    }

    if (window.IntersectionObserver) {
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) {
          if (en.isIntersecting && pvAlive(token)) {
            io.unobserve(en.target);
            renderPage(parseInt(en.target.getAttribute('data-p'), 10), en.target);
          }
        });
      }, { root: body, rootMargin: '700px 0px' });
      holders.forEach(function (h) { io.observe(h); });
    } else {
      for (var i = 0; i < holders.length; i++) await renderPage(i + 1, holders[i]);
    }

    $('pv-foot').textContent = '共 ' + total + ' 页 · 下滑继续加载';
  }

  /* ---- 结构索引 ---- */
  function folderById(id) {
    if (id == null) return null;
    for (var i = 0; i < state.folders.length; i++) {
      if (String(state.folders[i].id) === String(id)) return state.folders[i];
    }
    return null;
  }
  function childrenOf(pid) {
    return state.folders.filter(function (f) {
      return pid == null ? f.parent_id == null : String(f.parent_id) === String(pid);
    }).sort(function (a, b) {
      return (a.sort || 0) - (b.sort || 0) || String(a.name).localeCompare(String(b.name), 'zh');
    });
  }
  function filesOf(fid) {
    return state.files.filter(function (f) {
      return fid == null ? f.folder_id == null : String(f.folder_id) === String(fid);
    }).sort(function (a, b) { return String(a.name).localeCompare(String(b.name), 'zh'); });
  }
  function pathOf(fid) {
    var out = [], cur = folderById(fid), guard = 0;
    while (cur && guard++ < 50) { out.unshift(cur); cur = folderById(cur.parent_id); }
    return out;
  }
  function descendantIds(fid) {
    var out = [String(fid)], grew = true;
    while (grew) {
      grew = false;
      state.folders.forEach(function (f) {
        if (f.parent_id != null && out.indexOf(String(f.parent_id)) >= 0 && out.indexOf(String(f.id)) < 0) {
          out.push(String(f.id)); grew = true;
        }
      });
    }
    return out;
  }
  function subtreeFiles(fid) {
    var ids = descendantIds(fid);
    return state.files.filter(function (f) { return f.folder_id != null && ids.indexOf(String(f.folder_id)) >= 0; });
  }
  function fmtSize2(n) {
    n = Number(n) || 0;
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n / 1024).toFixed(0) + ' KB';
    if (n < 1073741824) return (n / 1048576).toFixed(1) + ' MB';
    return (n / 1073741824).toFixed(2) + ' GB';
  }
  function parentCategoryOf(pid) {
    var p = folderById(pid);
    return p ? p.category : null;
  }

  async function insertFileRec(folderId, file, path) {
    var res = await cloud.database.from('library_files').insert({
      folder_id: folderId == null ? null : Number(folderId),
      name: file.name,
      size: file.size || 0,
      mime: file.type || '',
      storage_path: path || null,
      uploader_uid: myUid(),
      uploader_name: (state.profile && state.profile.name) || ''
    }).select();
    if (res.error) throw new Error(res.error.message);
    return res.data && res.data[0];
  }

  async function refreshDrive() {
    state.folders = await fetchTable('folders');

    if (state.cwd != null && !folderById(state.cwd)) state.cwd = null;
    renderDrive();
    renderOverview();
    paintBoardBadges();
  }

  /* ---- 上传 ---- */
  function pickFiles() {
    var inp = el('input', { attrs: { type: 'file', multiple: 'multiple' } });
    inp.style.display = 'none';
    document.body.appendChild(inp);
    inp.addEventListener('change', function () {
      var list = Array.prototype.slice.call(inp.files || []);
      if (inp.parentNode) inp.parentNode.removeChild(inp);
      if (!list.length) return;
      runUploads(list.map(function (f) { return { file: f, folderId: state.cwd }; }),
        '上传到「' + curFolderName() + '」');
    });
    inp.click();
  }
  function curFolderName() {
    var t = pathOf(state.cwd);
    return t.length ? t[t.length - 1].name : '云盘根目录';
  }
  async function runUploads(items, title) {
    var body = el('div', { cls: 'modal-body' });
    var line = el('div', { cls: 'mini-note', text: '准备中…' });
    var fill = el('div', { cls: 'bar-fill' });
    var track = el('div', { cls: 'bar-track' }, [fill]);
    var log = el('div', { cls: 'drop-hint', text: '' });
    body.appendChild(line); body.appendChild(el('div', { attrs: { style: 'height:10px' } }));
    body.appendChild(track); body.appendChild(log);
    mountModal(modalShell(title || '上传文件', body, el('div', { cls: 'modal-foot' }, [
      el('button', { cls: 'btn btn-ghost', text: '在后台继续', attrs: { type: 'button' }, on: { click: closeModal } })
    ])));
    var ok = 0, fail = 0, fails = [];
    for (var i = 0; i < items.length; i++) {
      var it = items[i], file = it.file;
      line.textContent = '(' + (i + 1) + '/' + items.length + ') ' + file.name;
      try {
        var path = newStoragePath(file.name);
        await storagePut(path, file);
        if (it.replaceId) {
          var old = (state.files.filter(function (x) { return String(x.id) === String(it.replaceId); })[0] || {}).storage_path;
          var up = await cloud.database.from('library_files').update({
            storage_path: path, size: file.size || 0, mime: file.type || '',
            uploader_uid: myUid(), uploader_name: (state.profile && state.profile.name) || '',
            updated_at: new Date().toISOString()
          }).eq('id', it.replaceId).select();
          if (up.error) throw new Error(up.error.message);
          if (old && old !== path) await storageRemove(old);
        } else {
          await insertFileRec(it.folderId, file, path);
        }
        ok++;
      } catch (e) { fail++; fails.push(file.name + '（' + (e && e.message ? e.message : e) + '）'); }
      fill.style.width = Math.round((i + 1) / items.length * 100) + '%';
      log.textContent = '成功 ' + ok + ' · 失败 ' + fail;
    }
    line.textContent = '上传完成：成功 ' + ok + ' 个，失败 ' + fail + ' 个';
    if (fails.length) {
      log.style.whiteSpace = 'pre-wrap';
      log.style.lineHeight = '1.7';
      log.textContent = '失败清单：\n' + fails.slice(0, 30).map(function (x, j) { return (j + 1) + '. ' + x; }).join('\n')
        + (fails.length > 30 ? '\n…其余 ' + (fails.length - 30) + ' 个略' : '');
    }
    if (ok) { toast('已上传 ' + ok + ' 个文件', 'ok'); await refreshDrive(); }
  }

  /* ---- 同步本地文件夹 ---- */
  function openFolderSync() {
    var body = el('div', { cls: 'modal-body' });
    body.appendChild(el('p', { cls: 'muted', text: '选择电脑上的资料夹（例如「管院团委XCB资料库」）。系统会按相对路径把文件放进对应的云盘文件夹：同名文件覆盖更新，没有的目录和文件自动新建，不会删除你云盘里已有的东西。' }));
    var inp = el('input', { cls: 'input', attrs: { type: 'file', multiple: 'multiple', webkitdirectory: 'webkitdirectory', directory: 'directory' } });
    inp.style.height = 'auto'; inp.style.padding = '8px';
    var log = el('div', { cls: 'drop-hint', text: '等待选择文件夹…' });
    body.appendChild(inp);
    body.appendChild(el('div', { cls: 'mini-note', text: '提示：手机端浏览器可能不支持选择文件夹，请在电脑上操作。已上传且大小未变的文件会自动跳过，只补传新增和失败的，所以重复点不会白跑一遍。' }));
    body.appendChild(el('div', { cls: 'mini-note', text: '注意：平台对单个文件有体积上限（约 25MB 以内稳妥），超限的文件会被服务端拒绝（报 413），例如几百 MB 的视频、几十 MB 的 PPT。这类文件请先压缩再上传，或保留在本地。' }));
    body.appendChild(log);
    inp.addEventListener('change', async function () {
      var picked = Array.prototype.slice.call(inp.files || []);
      if (!picked.length) return;
      log.textContent = '共 ' + picked.length + ' 个文件，正在整理目录…';
      try { await syncLocalFolder(picked, log); }
      catch (e) { log.textContent = '同步中断：' + e.message; }
    });
    mountModal(modalShell('同步本地文件夹', body, el('div', { cls: 'modal-foot' }, [
      el('button', { cls: 'btn btn-ghost', text: '关闭', attrs: { type: 'button' }, on: { click: closeModal } })
    ])));
  }
  async function syncLocalFolder(picked, log) {
    var idx = {};                       // 全路径 -> folder row
    state.folders.forEach(function (f) {
      idx[pathOf(f.id).map(function (x) { return x.name; }).join('/')] = f;
    });
    var fileIdx = {};                   // folderId|name -> file row
    state.files.forEach(function (f) { fileIdx[(f.folder_id == null ? 'root' : f.folder_id) + '|' + f.name] = f; });

    async function ensurePath(segments) {
      var prefix = '', parentId = null, parentCat = null, cur = null;
      for (var i = 0; i < segments.length; i++) {
        prefix = prefix ? prefix + '/' + segments[i] : segments[i];
        cur = idx[prefix];
        if (!cur) {
          var res = await cloud.database.from('folders').insert({
            parent_id: parentId, name: segments[i],
            category: guessCategory(segments[i], parentCat), note: '', sort: 0
          }).select();
          if (res.error) throw new Error(res.error.message);
          cur = res.data && res.data[0];
          idx[prefix] = cur;
        }
        parentId = cur.id; parentCat = cur.category;
      }
      return parentId;
    }

    var ok = 0, fail = 0, skip = 0, fails = [];
    for (var i = 0; i < picked.length; i++) {
      var file = picked[i];
      var rel = (file.webkitRelativePath || file.name).split('/');
      rel.shift();                       // 去掉用户选中的最外层文件夹名
      var fileName = rel.pop();
      var folderId = rel.length ? await ensurePath(rel) : null;
      log.textContent = '(' + (i + 1) + '/' + picked.length + ') ' + fileName;
      try {
        var key = (folderId == null ? 'root' : folderId) + '|' + fileName;
        var exist = fileIdx[key];
        if (exist && exist.storage_path && Number(exist.size) === Number(file.size || 0)) {
          skip++;                        // 云盘已有同一文件且大小一致，跳过不重传
        } else {
          var path = newStoragePath(fileName);
          await storagePut(path, file);
          if (exist) {
            if (exist.storage_path && exist.storage_path !== path) await storageRemove(exist.storage_path);
            var up = await cloud.database.from('library_files').update({
              storage_path: path, size: file.size || 0, mime: file.type || '',
              uploader_uid: myUid(), uploader_name: (state.profile && state.profile.name) || '',
              updated_at: new Date().toISOString()
            }).eq('id', exist.id).select();
            if (up.error) throw new Error(up.error.message);
            exist.storage_path = path; exist.size = file.size || 0; exist.mime = file.type || '';
          } else {
            fileIdx[key] = await insertFileRec(folderId, { name: fileName, size: file.size, type: file.type }, path);
          }
          ok++;
        }
      } catch (e) { fail++; fails.push(fileName + '（' + (e && e.message ? e.message : e) + '）'); }
      log.textContent = '成功 ' + ok + ' · 跳过 ' + skip + ' · 失败 ' + fail + ' —— ' + fileName;
    }
    log.style.whiteSpace = 'pre-wrap';
    log.style.lineHeight = '1.7';
    log.textContent = '同步完成：成功 ' + ok + ' 个，跳过 ' + skip + ' 个（云盘已是最新），失败 ' + fail + ' 个。'
      + (fails.length ? '\n失败清单：\n' + fails.slice(0, 30).map(function (x, j) { return (j + 1) + '. ' + x; }).join('\n')
        + (fails.length > 30 ? '\n…其余 ' + (fails.length - 30) + ' 个略' : '') : '');
    toast('同步完成：成功 ' + ok + '，失败 ' + fail, fail ? 'err' : 'ok');
    await refreshDrive();
  }

  /* ---- 文件夹 / 文件 操作 ---- */
  function openFolderModal(opts) {
    var rec = opts.record || null;
    var nameInp = el('input', { cls: 'input', attrs: { type: 'text', maxlength: '80', placeholder: '文件夹名称' } });
    nameInp.value = rec ? rec.name : '';
    var catSel = el('select', { cls: 'input' });
    DRIVE_CATEGORIES.forEach(function (c) {
      var op = el('option', { text: c, attrs: { value: c } });
      if (rec && c === rec.category) op.selected = true;
      catSel.appendChild(op);
    });
    var catTouched = !!rec;
    var parentCat = parentCategoryOf(opts.parentId);
    if (!rec) catSel.value = guessCategory('', parentCat);
    nameInp.addEventListener('input', function () {
      if (!catTouched) catSel.value = guessCategory(nameInp.value, parentCat);
    });
    catSel.addEventListener('change', function () { catTouched = true; });

    var body = el('div', { cls: 'modal-body' });
    body.appendChild(el('div', { cls: 'field' }, [
      el('label', { text: '文件夹名称' }), nameInp
    ]));
    body.appendChild(el('div', { cls: 'field' }, [
      el('label', { text: '本层分类（自动识别，可手动调整）' }), catSel,
      el('div', { cls: 'hint', text: '分类依据文件夹名称关键词自动判定，你也可以直接改成想要的分类。' })
    ]));
    if (!rec) {
      body.appendChild(el('div', { cls: 'mini-note', text: '将创建在：' + curFolderName() }));
    }

    var saveBtn = el('button', { cls: 'btn', text: '保存', attrs: { type: 'button' } });
    saveBtn.addEventListener('click', async function () {
      var name = nameInp.value.trim();
      if (!name) { toast('请填写文件夹名称', 'err'); return; }
      saveBtn.disabled = true; saveBtn.textContent = '保存中…';
      var res;
      if (rec) {
        res = await cloud.database.from('folders')
          .update({ name: name, category: catSel.value, updated_at: new Date().toISOString() })
          .eq('id', rec.id).select();
      } else {
        var maxSort = childrenOf(opts.parentId).reduce(function (m, x) { return Math.max(m, x.sort || 0); }, 0);
        res = await cloud.database.from('folders').insert({
          parent_id: opts.parentId == null ? null : Number(opts.parentId),
          name: name, category: catSel.value, note: '', sort: maxSort + 1
        }).select();
      }
      saveBtn.disabled = false; saveBtn.textContent = '保存';
      if (res.error) { toast('保存失败：' + res.error.message, 'err'); return; }
      closeModal(); toast(rec ? '已保存' : '已新建文件夹', 'ok');
      await refreshDrive();
    });

    mountModal(modalShell(rec ? '编辑文件夹' : '新建文件夹', body, el('div', { cls: 'modal-foot' }, [
      el('button', { cls: 'btn btn-ghost', text: '取消', attrs: { type: 'button' }, on: { click: closeModal } }),
      saveBtn
    ])));
  }
